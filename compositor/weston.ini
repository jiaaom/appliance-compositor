# appliance-compositor base config. The launcher appends the clients'
# fragments (/etc/appliance-compositor/clients.d/*.ini) to this file; see
# docs/CONTRACT.md.

[core]
# An appliance may have no keyboard or touchscreen at all (a NAS driving a
# TV, with the remote paired later); weston refuses to start without input
# devices unless told otherwise.
require-input=false

[shell]
# Behind every window, and on outputs no client uses.
background-color=0xff000000

# The screensaver (appliance-screensaver, run by a client while its screen is
# dark) is above every client window, so it alone gets keys and touches.
[appliance-rule]
app-id=screensaver
layer=100
